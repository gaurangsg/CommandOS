services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-commandos}
      MYSQL_USER: ${MYSQL_USER:-commandos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-locally}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password-locally}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - commandos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - commandos_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  commandos_mysql:
  commandos_redis:
